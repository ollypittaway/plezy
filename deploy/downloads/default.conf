map $host $platform {
    default                     "";
    firestick.offstage.download firestick;
    android.offstage.download   android;
    ios.offstage.download       ios;
    win.offstage.download       windows;
    windows.offstage.download   windows;
    mac.offstage.download       mac;
}

server {
    listen 8080 default_server;
    server_name _;
    add_header Cache-Control "no-store" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location = / {
        if ($platform = "") { return 404; }
        return 302 https://offstage.download/api/downloads/$platform;
    }
    location = /releases/latest {
        if ($host != firestick.offstage.download) { return 404; }
        proxy_pass https://offstage.download/api/fire-tv-release;
        proxy_pass_request_headers off;
        proxy_set_header Host offstage.download;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
    location ~ ^/releases/download/(v[0-9]+\.[0-9]+\.[0-9]+)/GucciPlexa-Firestick\.apk$ {
        if ($host != firestick.offstage.download) { return 404; }
        return 302 https://github.com/ollypittaway/plezy/releases/download/$1/Offstage-Firestick-Migration.apk;
    }
    location ~ ^/releases/download/(v[0-9]+\.[0-9]+\.[0-9]+)/Offstage-Firestick\.apk$ {
        if ($host != firestick.offstage.download) { return 404; }
        return 302 https://github.com/ollypittaway/plezy/releases/download/$1/Offstage-Firestick.apk;
    }
    location = /SHA256SUMS.txt {
        if ($platform = "") { return 404; }
        return 302 https://offstage.download/api/downloads/$platform?checksum=1;
    }
    location = /armeabi-v7a {
        if ($host != android.offstage.download) { return 404; }
        return 302 https://offstage.download/api/downloads/android?arch=armeabi-v7a;
    }
    location = /x86_64 {
        if ($host != android.offstage.download) { return 404; }
        return 302 https://offstage.download/api/downloads/android?arch=x86_64;
    }
    location / { return 404; }
}
