proxy_cache_path /var/cache/nginx/releases keys_zone=release_feed:1m inactive=1d max_size=8m;

map $host $package {
    default                 "";
    firestick.offstage.download  Offstage-Firestick.apk;
    android.offstage.download Offstage-Android-arm64-v8a.apk;
    ios.offstage.download Offstage-iOS-unsigned.ipa;
    win.offstage.download Offstage-Windows-Setup.exe;
    windows.offstage.download Offstage-Windows-Setup.exe;
    mac.offstage.download Offstage-macOS.dmg;
}

server {
    listen 8080 default_server;
    server_name _;
    set $latest https://github.com/ollypittaway/plezy/releases/latest/download;
    add_header Cache-Control "no-store" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location = / {
        if ($package = "") { return 404; }
        return 302 $latest/$package;
    }
    location = /releases/latest {
        if ($host != firestick.offstage.download) { return 404; }
        proxy_pass https://api.github.com/repos/ollypittaway/plezy/releases/latest;
        proxy_pass_request_headers off;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent Offstage-Download-Router;
        proxy_set_header Accept application/vnd.github+json;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_cache release_feed;
        proxy_cache_key latest;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Vary;
        proxy_cache_valid 200 3m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # Installed clients match this name and its URL before requesting the pinned download.
        sub_filter_types application/json application/vnd.github+json;
        sub_filter_once off;
        sub_filter 'Offstage-Firestick-Migration.apk' 'GucciPlexa-Firestick.apk';
    }
    location ~ ^/releases/download/(v[0-9]+\.[0-9]+\.[0-9]+)/GucciPlexa-Firestick\.apk$ {
        if ($host != firestick.offstage.download) { return 404; }
        return 302 https://github.com/ollypittaway/plezy/releases/download/$1/Offstage-Firestick-Migration.apk;
    }
    location ~ ^/releases/download/(v[0-9]+\.[0-9]+\.[0-9]+)/Offstage-Firestick\.apk$ {
        if ($host != firestick.offstage.download) { return 404; }
        return 302 https://github.com/ollypittaway/plezy/releases/download/$1/Offstage-Firestick.apk;
    }
    location = /SHA256SUMS.txt {
        if ($package = "") { return 404; }
        return 302 $latest/SHA256SUMS.txt;
    }
    location = /armeabi-v7a {
        if ($host != android.offstage.download) { return 404; }
        return 302 $latest/Offstage-Android-armeabi-v7a.apk;
    }
    location = /x86_64 {
        if ($host != android.offstage.download) { return 404; }
        return 302 $latest/Offstage-Android-x86_64.apk;
    }
    location / { return 404; }
}
