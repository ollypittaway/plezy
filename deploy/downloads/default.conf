map $host $package {
    default                 "";
    firestick.pittaway.dev  GucciPlexa-Firestick.apk;
    android.pittaway.dev    GucciPlexa-Android-arm64-v8a.apk;
    ios.pittaway.dev        GucciPlexa-iOS-unsigned.ipa;
    windows.pittaway.dev    GucciPlexa-Windows-Setup.exe;
    mac.pittaway.dev        GucciPlexa-macOS.dmg;
}

server {
    listen 8080 default_server;
    server_name _;
    set $latest https://github.com/ollypittaway/plezy/releases/latest/download;
    add_header Cache-Control "no-store" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location = / {
        if ($package = "") { return 404; }
        return 302 $latest/$package;
    }
    location = /SHA256SUMS.txt {
        if ($package = "") { return 404; }
        return 302 $latest/SHA256SUMS.txt;
    }
    location = /armeabi-v7a {
        if ($host != android.pittaway.dev) { return 404; }
        return 302 $latest/GucciPlexa-Android-armeabi-v7a.apk;
    }
    location = /x86_64 {
        if ($host != android.pittaway.dev) { return 404; }
        return 302 $latest/GucciPlexa-Android-x86_64.apk;
    }
    location / { return 404; }
}
